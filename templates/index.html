<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank and Standard Similarity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Compare Bank ESG Report with Standard</h1>
    <form method="post" action="/calculate">
        <label for="bank">Select Bank:</label>
        <select name="bank" required>
            <option value="">-- Select Bank --</option>
            {% for bank in banks %}
                <option value="{{ bank }}" {% if bank == request.form.bank %}selected{% endif %}>{{ bank }}</option>
            {% endfor %}
        </select>

        <label for="standard">Select Standard:</label>
        <select name="standard" required>
            <option value="">-- Select Standard --</option>
            {% for std in standards %}
                <option value="{{ std }}" {% if std == request.form.standard %}selected{% endif %}>{{ std }}</option>
            {% endfor %}
        </select>

        <button type="submit">Calculate Similarity</button>
    </form>

    {% if score is not none %}
    <div class="result">
        <h2>Similarity Result</h2>
        <p><strong>{{ bank }}</strong> compared to <strong>{{ standard }}</strong></p>
        <p>Similarity Score: <strong>{{ score }}</strong></p>
    </div>
    {% endif %}
</div>
</body>
</html>
