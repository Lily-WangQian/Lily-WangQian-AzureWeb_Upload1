<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Similarity Calculator</title>
</head>
<body>
    <h1>Bank Similarity Calculator</h1>

    <form action="/calculate" method="post">
        <label>Select First Bank:</label>
        <select name="bank1" required>
            {% for bank in banks %}
            <option value="{{ bank }}">{{ bank }}</option>
            {% endfor %}
        </select>

        <label>Select Second Bank:</label>
        <select name="bank2" required>
            {% for bank in banks %}
            <option value="{{ bank }}">{{ bank }}</option>
            {% endfor %}
        </select>

        <button type="submit">Calculate Similarity</button>
    </form>

    {% if similarity_result %}
    <h2>Similarity Result</h2>
    <p>{{ similarity_result.bank1 }} and {{ similarity_result.bank2 }} → Score: {{ similarity_result.score }}</p>
    {% endif %}

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
