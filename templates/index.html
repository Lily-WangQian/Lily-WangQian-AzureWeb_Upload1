<!DOCTYPE html>
<html>
<head>
    <title>Bank vs Standard Similarity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Bank vs Standard Similarity</h1>

    <form method="POST" action="/calculate" class="row g-3">
        <div class="col-md-6">
            <label for="bank" class="form-label">Select Bank:</label>
            <select name="bank" class="form-select" required>
                {% for b in banks %}
                    <option value="{{ b }}" {% if b == bank %}selected{% endif %}>{{ b }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label for="standard" class="form-label">Select Standard:</label>
            <select name="standard" class="form-select" required>
                {% for s in standards %}
                    <option value="{{ s }}" {% if s == standard %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Calculate Similarity</button>
        </div>
    </form>

    {% if score is not none %}
        <div class="alert alert-info mt-4">
            <h4>Similarity Score:</h4>
            <p>{{ bank }} ↔ {{ standard }} = <strong>{{ score }}</strong></p>
        </div>
    {% endif %}

    {% if bank_table and standard_table %}
        <div class="row mt-4">
            <div class="col-md-6">
                <h4>{{ bank }} ESG Report</h4>
                <div class="table-responsive">
                    {{ bank_table | safe }}
                </div>
            </div>
            <div class="col-md-6">
                <h4>{{ standard }} Standard Report</h4>
                <div class="table-responsive">
                    {{ standard_table | safe }}
                </div>
            </div>
        </div>
    {% endif %}
</body>
</html>
